name: Deploy Nightly
on:
  # This can be used to allow manually triggering nightlies from the web interface
  workflow_dispatch:

jobs:
  nightly:
    name: Deploy nightly
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: set release version
        run: echo "RELEASE_VERSION=nightly-$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: allow gradlew to be executed
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build -Pversion=${{ env.RELEASE_VERSION }}

      - name: create release
        uses: WebFreak001/deploy-nightly@v3.2.0
        with:
          upload_url: https://uploads.github.com/repos/ClassySK/ClassySK-minestom/releases/383316480/assets{?name,label} # find out this value by opening https://api.github.com/repos/<owner>/<repo>/releases in your browser and copy the full "upload_url" value including the {?name,label} part
          release_id: 383316480 # same as above (id can just be taken out the upload_url, it's used to find old releases)
          asset_path: ./build/libs/ClassySK-${{ env.RELEASE_VERSION }}.jar # path to archive to upload
          asset_name: ClassySK-${{ env.RELEASE_VERSION }}.jar # name to upload the release as, use $$ to insert date (YYYYMMDD) and 6 letter commit hash
          asset_content_type: application/java-archive # required by GitHub API
          max_releases: 1 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted
          ignore_hash: true # optional, if there is already a release associated with the repo's current commit, should we go ahead and upload the asset anyway.